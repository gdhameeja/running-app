<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Running Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <h2>Live Running Tracker</h2>

        <!-- Tab Navigation -->
        <div class="tab-bar">
            <button class="tab active" data-tab="track">Track</button>
            <button class="tab" data-tab="courses">Courses</button>
            <button class="tab" data-tab="stats">Stats</button>
        </div>

        <!-- ═══ TRACK TAB ═══ -->
        <div class="tab-content active" id="tab-track">
            <!-- Guided Run Coach Panel -->
            <div id="guided-run-panel" style="display:none;">
                <div class="gr-session-title" id="gr-session-name"></div>
                <div class="gr-type" id="gr-segment-type">GET READY</div>
                <div class="gr-intensity" id="gr-segment-intensity"></div>
                <div class="gr-countdown" id="gr-time-remaining">--:--</div>
                <div class="gr-progress-bar"><div class="gr-progress-fill" id="gr-segment-progress"></div></div>
                <div class="gr-next" id="gr-next-segment"></div>
                <div class="gr-count" id="gr-segment-count"></div>
            </div>
            <div id="map"></div>
            <p>Distance: <span id="distance">0.00 kms</span></p>
            <p>Time Elapsed: <span id="time">0:00</span></p>
            <p>Average Pace: <span id="pace">0:00 /km</span></p>
            <button id="start"><span class="material-icons">play_arrow</span></button>
            <button id="pause" disabled><span class="material-icons">pause</span></button>
            <button id="stop" disabled><span class="material-icons">stop</span></button>
            <button id="showPreviousRuns">Show Previous Runs</button>
            <div id="previousRunsSection" style="display:none; margin-top:20px;">
                <label for="pageSizeSelect">Runs per page:</label>
                <select id="pageSizeSelect">
                    <option value="5">5</option>
                    <option value="10" selected>10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
                <div style="margin:10px 0;">
                    <button id="prevPage">Previous</button>
                    <button id="nextPage">Next</button>
                </div>
                <div id="previous-runs-container"></div>
            </div>
        </div>

        <!-- ═══ COURSES TAB ═══ -->
        <div class="tab-content" id="tab-courses">
            <!-- Active course banner (shown when enrolled) -->
            <div id="active-course-banner" style="display:none;">
                <div class="acb-header">
                    <span id="acb-icon"></span>
                    <span id="acb-name"></span>
                    <span class="acb-level" id="acb-level"></span>
                </div>
                <div class="progress-bar"><div class="progress-fill" id="acb-progress"></div></div>
                <p id="acb-detail"></p>
                <button id="acb-view" class="btn-small">View Sessions</button>
                <button id="acb-abandon" class="btn-small btn-danger">Abandon</button>
            </div>

            <!-- Course cards grid -->
            <div id="course-grid"></div>

            <!-- Course detail view (hidden by default) -->
            <div id="course-detail" style="display:none;">
                <button id="back-to-courses" class="btn-small">← Back</button>
                <div class="course-detail-header">
                    <span id="cd-icon" class="cd-icon"></span>
                    <h3 id="cd-name"></h3>
                </div>
                <p id="cd-description"></p>
                <div class="level-selector">
                    <button class="level-btn active" data-level="beginner">Beginner</button>
                    <button class="level-btn" data-level="intermediate">Intermediate</button>
                    <button class="level-btn" data-level="expert">Expert</button>
                </div>
                <p id="cd-level-desc" class="level-desc"></p>
                <p id="cd-level-info" class="level-info"></p>
                <button id="start-course" class="btn-primary">Start Course</button>
                <div id="session-list"></div>
            </div>
        </div>

        <!-- ═══ STATS TAB ═══ -->
        <div class="tab-content" id="tab-stats">
            <div id="stats-empty" style="display:none;">
                <p>No run data yet. Complete some runs to see your stats!</p>
            </div>
            <div id="stats-content">
                <h3>Pace Trend</h3>
                <div id="pace-chart-container" class="chart-container">
                    <canvas id="paceChart"></canvas>
                </div>

                <h3>Weekly Volume</h3>
                <div class="chart-container">
                    <canvas id="volumeChart"></canvas>
                </div>

                <h3>Personal Bests</h3>
                <div id="personal-bests" class="pb-grid"></div>

                <div id="vo2max-section" style="display:none;">
                    <h3>Estimated VO2max</h3>
                    <div class="vo2max-card">
                        <span id="vo2max-value" class="vo2max-number"></span>
                        <span class="vo2max-unit">ml/kg/min</span>
                    </div>
                    <p class="vo2max-note">Estimated from Cooper formula on ~12 min runs</p>
                </div>

                <h3>Course Progress</h3>
                <div id="course-progress-stats"></div>
            </div>
        </div>
    </div>

    <script src="courses.js"></script>
    <script src="script.js"></script>
    <script src="performance.js"></script>
</body>
</html>
